services:
  db:
    image: postgres:16
    container_name: fabtool-db
    environment:
      POSTGRES_DB: fabtool
      POSTGRES_USER: fabtool
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - fabtool_pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabtool -d fabtool"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  fabtool_pgdata:
