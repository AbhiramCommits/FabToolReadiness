name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fabtool
          POSTGRES_USER: fabtool
          POSTGRES_PASSWORD: fabtool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabtool -d fabtool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FABTOOL_DB_HOST: localhost
      FABTOOL_DB_PORT: "5432"
      FABTOOL_DB_USER: fabtool
      FABTOOL_DB_NAME: fabtool
      POSTGRES_PASSWORD: fabtool_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply schema
        run: >
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U fabtool -d fabtool
          -v ON_ERROR_STOP=1 -f sql/01_schema.sql

      - name: Seed fixture (for make check)
        run: >
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U fabtool -d fabtool
          -v ON_ERROR_STOP=1 -f tests/fixture_seed.sql

      - name: Run pytest suite
        run: python -m pytest tests/ -v

      - name: Run data quality checks
        run: make check
